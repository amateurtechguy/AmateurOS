<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="home.css">
    <link rel="icon" type="image/png" href="Pictures/favicon.png">
</head>

<body>

    <div class="desktop"></div>

    <header class="toolbar">

        <div class="toolbar-left">

            <a href="https://github.com/amateurtechguy/AmateurOS" class="os-link">
                <button class="os-button">
                    <span class="logo">A</span>
                </button>
            </a>

            <button class="nav-button" id="appsButton">Apps</button>
            <button class="nav-button" id="filesButton">Files</button>
            <button class="nav-button" id="settingsButton">Settings</button>

        </div>

        <div class="toolbar-right">

            <span class="status">
                <span class="status-dot"></span>
                Online
            </span>

            <span class="time" id="clock">12:00</span>

            <button class="power-button">⏻</button>

        </div>

    </header>

    <main class="desktopcontent">

    <div class="window" id="homeWindow">

        <div class="window-header">
            <div class="window-title">
                <span class="window-icon">A</span>
                <span>AmateurOS</span>
            </div>

            <div class="window-buttons">
                <button class="minimize">−</button>
                <button class="maximize">□</button>
                <button class="close">×</button>
            </div>
        </div>

        <div class="windowcontent">
            <h1>Welcome to AmateurOS</h1>
            <p>Your desktop is ready, Make sure to leave a positive review on this operating system, I really worked hard on this project and I think it's one of my most impressive projects! *ALSO DOUBLE CLICK ANY DESKTOP APP TO OPEN IT*</p>
        </div>

    </div>

    <div class="app-icon" id="calculatorApp">
        <div class="calc-icon">
            <img src="Pictures/calculator.png" alt="Calculator">
        </div>
        <span>Calculator</span>
    </div>
 </main>
   
    <script src="home.js"></script>

</body>
</html>
